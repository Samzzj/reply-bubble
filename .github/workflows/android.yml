name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 运行器镜像自带 Android SDK；这里只做尽力而为的补齐，失败不影响构建
      - name: Ensure SDK platform 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reply-bubble-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 自动发版：Releases 页面直接能下载 apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v0.1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "reply-bubble-${VER}-debug.apk"
          gh release create "$VER" "reply-bubble-${VER}-debug.apk" \
            --title "回复球 ${VER}" \
            --notes "自动构建的 debug APK，在本页下方 Assets 里下载。安装后先在 App 里填 API Key 和人设卡，再开启悬浮球并授权「显示在其他应用上层」。"
