name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定签名：第一次跑时生成并提交回仓库，之后所有版本都能覆盖安装
      - name: Ensure stable debug keystore
        run: |
          if [ ! -f keystore/debug.jks ]; then
            echo "generating keystore"
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/debug.jks -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.email "ci@localhost"
            git config user.name "ci"
            git add keystore/debug.jks
            git commit -m "chore: 固定 debug 签名，让后续版本可覆盖安装"
            git push
          else
            echo "keystore already present"
          fi

      # 运行器镜像自带 Android SDK；这里只做尽力而为的补齐
      - name: Ensure SDK platform 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reply-bubble-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="v0.2.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "reply-bubble-${VER}-debug.apk"
          gh release create "$VER" "reply-bubble-${VER}-debug.apk" \
            --title "回复球 ${VER}" \
            --notes "iOS 风悬浮球 + 底部面板，字号加大。从这一版起使用固定签名，可直接覆盖安装。"
